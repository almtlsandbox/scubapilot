# Lance les tests automatiques à chaque envoi sur GitHub, sous Windows (là où ScubaPilot est
# utilisé) et sous Linux, avec le vrai Express installé par npm.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Installer les composants
        run: npm install --no-audit --no-fund
      - name: Lancer les tests
        run: npm test
      # Affiche package-lock.json (en base64, entre deux repères) dans le journal, pour qu'il puisse être
      # récupéré et versionné dans le dépôt. Étape temporaire.
      - name: Afficher package-lock.json
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=====LOCK-DEBUT====="
          base64 -w0 package-lock.json
          echo
          echo "=====LOCK-FIN====="
