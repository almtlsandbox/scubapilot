# Lance les tests automatiques à chaque envoi sur GitHub, sous Windows (là où ScubaPilot est
# utilisé) et sous Linux, avec le vrai Express installé par npm.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Installer les composants
        run: npm install --no-audit --no-fund
      - name: Lancer les tests
        run: npm test
      # Le fichier des versions exactes des composants, produit ici (le réseau est disponible) pour être
      # récupéré puis versionné dans le dépôt.
      - name: Conserver package-lock.json
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
