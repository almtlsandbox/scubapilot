<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScubaPilot</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script>
  // Thème appliqué avant l'affichage, pour éviter un éclair blanc en mode sombre.
  (function () {
    var pref = 'auto';
    try { pref = localStorage.getItem('scubapilot-theme') || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="stylesheet" href="style.css?v=1.22">
</head>
<body>
  <div id="toast" aria-live="polite" aria-atomic="false"></div>
  <header class="topbar">
    <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">☰</button>
    <img src="logo.svg" alt="" class="brand-logo"><span>ScubaPilot</span>
  </header>
  <div id="menu-backdrop" class="menu-backdrop"></div>
  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="brand"><img src="logo.svg" alt="" class="brand-logo">ScubaPilot</div>
      <a href="#/dashboard" class="nav-link" data-route="dashboard">Tableau de bord</a>
      <a href="#/students" class="nav-link" data-route="students">Étudiants</a>
      <a href="#/invoices" class="nav-link" data-route="invoices">Factures</a>
      <a href="#/new-course" class="nav-link" data-route="new-course">+ Nouveau cours</a>
      <a href="#/settings" class="nav-link" data-route="settings">Paramètres</a>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </nav>
    <main id="app" class="content"></main>
  </div>
  <script src="app.js?v=1.22"></script>
</body>
</html>
